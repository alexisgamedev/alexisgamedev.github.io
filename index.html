<style>
  :root {
    --bg: #07090e;
    --surface: #0d1118;
    --surface2: #111620;
    --border: oklch(28% 0.03 220);
    --border-bright: oklch(42% 0.08 50);
    --cyan: oklch(74% 0.17 50);
    --violet: oklch(68% 0.17 280);
    --text: oklch(91% 0.01 220);
    --muted: oklch(52% 0.025 220);
    --dim: oklch(35% 0.02 220);
    --font-display: 'Space Grotesk', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    line-height: 1.6;
    overflow-x: hidden;
  }
  /* Scanline texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.04) 2px,
      rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }
  /* Grid bg on hero */
  .hero-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 30%, transparent 100%);
    opacity: 0.35;
  }
  .hero-glow {
    position: absolute;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(ellipse, oklch(74% 0.17 195 / 0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 48px;
    background: linear-gradient(to bottom, rgba(7,9,14,0.95), transparent);
    backdrop-filter: blur(8px);
  }
  .nav-logo {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--cyan);
    letter-spacing: 0.08em;
    text-decoration: none;
  }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.06em;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--text); }

  /* HERO */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 140px 48px 80px;
    overflow: hidden;
  }
  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--cyan);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.6s 0.1s forwards;
  }
  .hero-name {
    font-size: clamp(56px, 8vw, 104px);
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.7s 0.2s forwards;
  }
  .hero-name em {
    font-style: normal;
    color: transparent;
    -webkit-text-stroke: 1px var(--cyan);
  }
  .hero-bio {
    max-width: 560px;
    font-size: 17px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.7s 0.35s forwards;
    font-weight: 300;
  }
  .hero-links {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 0.7s 0.5s forwards;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
    background: var(--surface);
  }
  .pill:hover { border-color: var(--cyan); color: var(--cyan); }
  .pill .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--cyan);
    opacity: 0.5;
  }
  .hero-scroll {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0;
    animation: fadeIn 1s 1.2s forwards;
  }
  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, var(--cyan), transparent);
    animation: scrollPulse 2s 1.5s infinite;
  }

  /* SECTION */
  section { padding: 100px 48px; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 56px;
  }
  .section-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--cyan);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .section-title {
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* PROJECTS */
  .projects-featured {
    margin-bottom: 24px;
  }
  .project-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
    position: relative;
  }
  .project-card:hover {
    border-color: var(--border-bright);
    box-shadow: 0 0 32px oklch(74% 0.17 195 / 0.08), 0 4px 24px rgba(0,0,0,0.4);
    transform: translateY(-2px);
  }
  .project-card.featured {
    display: grid;
    grid-template-columns: 1fr 380px;
  }
  .project-card.featured .project-img {
    aspect-ratio: auto;
    height: 320px;
  }
  .project-img {
    background: var(--surface2);
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .project-img-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.15;
  }
  .project-img-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--dim);
    z-index: 1;
    text-align: center;
  }
  .project-body {
    padding: 28px 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 16px;
  }
  .project-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .project-year {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--cyan);
    letter-spacing: 0.1em;
  }
  .tag {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--dim);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 2px;
    letter-spacing: 0.05em;
  }
  .project-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .project-card.featured .project-title { font-size: 28px; }
  .project-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.65;
    font-weight: 300;
  }
  .project-role {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .project-links {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .project-link {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 2px;
    transition: border-color 0.2s, color 0.2s;
  }
  .project-link:hover { border-color: var(--cyan); color: var(--cyan); }
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .projects-grid .project-card .project-body { padding: 20px; }
  .projects-grid .project-card .project-title { font-size: 18px; }

  /* Animated corner accent */
  .project-card::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 40px; height: 40px;
    border-top: 1px solid var(--cyan);
    border-right: 1px solid var(--cyan);
    opacity: 0;
    transition: opacity 0.25s;
  }
  .project-card:hover::after { opacity: 1; }

  /* SKILLS */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
  }
  .skill-group {
    background: var(--surface);
    padding: 28px;
  }
  .skill-group-title {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--cyan);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .skill-tag {
    font-size: 13px;
    color: var(--muted);
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 2px;
    transition: color 0.2s, border-color 0.2s;
  }
  .skill-tag:hover { color: var(--text); border-color: var(--border-bright); }

  /* REFERENCES */
  .refs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .ref-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    border-radius: 4px;
  }
  .ref-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .ref-title { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-bottom: 12px; letter-spacing: 0.05em; }
  .ref-quote { font-size: 13px; color: var(--muted); font-weight: 300; line-height: 1.65; font-style: italic; }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--border);
    padding: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .footer-name {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .footer-links { display: flex; gap: 16px; }
  .footer-link {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer-link:hover { color: var(--cyan); }

  /* TWEAKS */
  .tweaks-panel {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--surface);
    border: 1px solid var(--border-bright);
    padding: 20px;
    width: 260px;
    z-index: 200;
    display: none;
    font-family: var(--font-mono);
    font-size: 12px;
    box-shadow: 0 0 40px oklch(74% 0.17 195 / 0.12);
  }
  .tweaks-panel.visible { display: block; }
  .tweaks-title {
    color: var(--cyan);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .tweak-row { margin-bottom: 14px; }
  .tweak-label { color: var(--muted); margin-bottom: 6px; display: block; }
  .tweak-select, .tweak-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    outline: none;
  }
  .tweak-select:focus, .tweak-input:focus { border-color: var(--cyan); }
  .tweak-swatch-row { display: flex; gap: 8px; }
  .tweak-swatch {
    width: 28px; height: 28px;
    border-radius: 2px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s;
  }
  .tweak-swatch.active { border-color: white; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes scrollPulse {
    0%, 100% { opacity: 0.4; transform: scaleY(1); }
    50% { opacity: 1; transform: scaleY(1.15); }
  }
  @media (max-width: 768px) {
    nav { padding: 16px 20px; }
    .nav-links { display: none; }
    .hero { padding: 120px 20px 60px; }
    section { padding: 60px 20px; }
    .project-card.featured { grid-template-columns: 1fr; }
    .project-card.featured .project-img { height: 200px; }
    footer { padding: 32px 20px; }
  }
</style>
</head>

<script>
// Tweaks system
window.addEventListener('message', (e) => {
  if (e.data?.type === '__activate_edit_mode') {
    document.getElementById('tweaksPanel').classList.add('visible');
  }
  if (e.data?.type === '__deactivate_edit_mode') {
    document.getElementById('tweaksPanel').classList.remove('visible');
  }
});
window.parent.postMessage({ type: '__edit_mode_available' }, '*');

// Accent swatches
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.tweak-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      document.querySelectorAll('.tweak-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      const hue = sw.dataset.accent;
      document.documentElement.style.setProperty('--cyan', `oklch(74% 0.17 ${hue})`);
      document.documentElement.style.setProperty('--border-bright', `oklch(42% 0.08 ${hue})`);
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accent: hue } }, '*');
    });
  });

  document.getElementById('twDensity')?.addEventListener('change', (e) => {
    const val = e.target.value;
    const map = { compact: '60px', normal: '100px', spacious: '140px' };
    document.querySelectorAll('section').forEach(s => s.style.paddingTop = map[val]);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { density: val } }, '*');
  });
});
</script>
